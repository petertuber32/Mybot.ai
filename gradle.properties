org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------
# Versioning (single source of truth)
# To release a new version: bump APP_VERSION_CODE (+1) and
# APP_VERSION_NAME, then push to main. The CI workflow builds and
# publishes a signed APK tagged v<APP_VERSION_NAME>.
# IMPORTANT: never change the package/applicationId below in
# app/build.gradle.kts - updates must keep the same package name
# and the same signing key.
# ---------------------------------------------------------------
APP_VERSION_CODE=2
APP_VERSION_NAME=2.0.0
