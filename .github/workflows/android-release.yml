name: Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: gradle testReleaseUnitTest --stacktrace

      - name: Decode signing keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not configured. Set the 4 signing secrets (ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) before building."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          echo "Keystore decoded: $(wc -c < "$RUNNER_TEMP/release-keystore.jks") bytes"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Resolve version and rename APK
        id: ver
        run: |
          VERSION=$(grep -oP 'APP_VERSION_NAME=\K.*' gradle.properties | tr -d '\r' | tr -d '"')
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          OUT="bacbo-analyzer-v${VERSION}.apk"
          cp "$APK" "$OUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bacbo-analyzer-apk
          path: ${{ steps.ver.outputs.apk }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          APK="${{ steps.ver.outputs.apk }}"
          gh release create "$TAG" "$APK" \
            --title "BAC BO AI ANALYZER $TAG" \
            --notes "APK Android release assinado digitalmente. Instalacao: permitir 'instalar apps desconhecidos' e abrir o APK. Ver README para detalhes e atualizacoes." \
            --latest || gh release upload "$TAG" "$APK" --clobber
          gh release edit "$TAG" --latest
